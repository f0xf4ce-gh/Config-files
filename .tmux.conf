# ============================================
# General
# ============================================
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 0
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g focus-events on
set -g set-clipboard on
set -g default-shell /opt/homebrew/bin/bash
set -g default-command "/opt/homebrew/bin/bash -l"

# ============================================
# Prefix: Ctrl-a is easier to reach than Ctrl-b
# ============================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind C-a last-window   # double-tap to jump to last window

# ============================================
# THE splits — | and -
# ============================================
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"   # new windows keep cwd too

# ============================================
# Vim-style pane navigation (no prefix needed for switching)
# ============================================
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix + HJKL, repeatable
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Swap window order without leaving seat
bind -r < swap-window -t -1\; select-window -t -1
bind -r > swap-window -t +1\; select-window -t +1

# ============================================
# Reload config on the fly
# ============================================
bind r source-file ~/.config/tmux/tmux.conf \; display "  config reloaded"

# ============================================
# Copy mode: vim keys + system clipboard
# ============================================
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"   # macOS
# Linux alt: "xclip -in -selection clipboard"
bind -T copy-mode-vi Escape send -X cancel
bind P paste-buffer

# Enter copy mode faster
bind Enter copy-mode

# ============================================
# Pane / window sanity
# ============================================
bind x kill-pane -a   # kill all OTHER panes, keep current
bind X kill-pane      # kill current pane, no confirm
set -g renumber-windows on
setw -g automatic-rename on
bind S set-window-option synchronize-panes\; display "  sync toggled"

# Quick pane zoom (fullscreen a pane without killing the split)
bind z resize-pane -Z

# ============================================
# Visuals — pane borders
# ============================================
set -g pane-border-style "fg=#404040"
set -g pane-active-border-style "fg=#c1c1c1"
set -g pane-border-lines heavy

# ============================================
# Status bar
# ============================================
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#000000,fg=#c1c1c1"

set -g status-left-length 40
set -g status-left "#[bg=#c1c1c1,fg=#000000,bold] #S #[bg=#000000,fg=#888888]#{?window_zoomed_flag, 🔍 ,}"

set -g status-right-length 100
set -g status-right "#{prefix_highlight}#[fg=#404040]#[bg=#404040,fg=#c1c1c1] #{cpu_percentage} #[fg=#888888]#[bg=#888888,fg=#000000] %H:%M #[fg=#c1c1c1]#[bg=#c1c1c1,fg=#000000,bold] #h "

# ============================================
# Windows
# ============================================
setw -g window-status-format " #I:#W#{?window_activity_flag,🔔,} "
setw -g window-status-style "fg=#888888,bg=#000000"
setw -g window-status-current-format "#[bg=#c1c1c1,fg=#000000] #I:#W #[bg=#000000,fg=#c1c1c1]"
setw -g window-status-current-style "fg=#000000,bg=#c1c1c1,bold"
setw -g window-status-activity-style "fg=#c1c1c1,bg=#000000"
setw -g monitor-activity on
set -g visual-activity off

# ============================================
# Messages / prompts
# ============================================
set -g message-style "bg=#404040,fg=#c1c1c1"
set -g message-command-style "bg=#404040,fg=#c1c1c1"

# Copy mode selection highlight
setw -g mode-style "bg=#c1c1c1,fg=#000000"

# ============================================
# Plugins
# ============================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @prefix_highlight_fg '#000000'
set -g @prefix_highlight_bg '#c1c1c1'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=#000000,bg=#888888'

# Init TPM — keep at the very bottom
run '~/.config/tmux/plugins/tpm/tpm'