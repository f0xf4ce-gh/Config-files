# ~/.config/starship.toml

# version: 1.0.0 (retheme: matched to custom Darkthrone palette)
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
continuation_prompt = "[▸▹ ](dimmed #c1c1c1)"

format = "╭─[${custom.pwd}$git_branch$git_status](bold #888888)─$character\n╰─➤ "
right_format = ""

[fill]
symbol = ' '

[character]
format = "$symbol"
success_symbol = "[⛧](bold #ffffff)"
error_symbol = "[○](italic #aaaaaa)"
vimcmd_symbol = "[■](italic dimmed #888888)"
# not supported in zsh
vimcmd_replace_one_symbol = "◌"
vimcmd_replace_symbol = "□"
vimcmd_visual_symbol = "▼"

[env_var.VIMSHELL]
format = "[$env_value]($style)"
style = '#888888 italic'

[sudo]
format = "[$symbol]($style)"
style = "bold italic #aaaaaa"
symbol = "⋈┈"
disabled = false

[username]
style_user = "#ffffff bold italic"
style_root = "#aaaaaa bold italic"
format = "[⭘ $user]($style)"
disabled = false
show_always = true

[hostname]
ssh_only = false
format = "[ @ $hostname](bold #888888) "

[shell]
disabled = true

[directory]
home_symbol = ""
truncation_length = 1
truncation_symbol = ""
read_only = " ◈"
use_os_path_sep = true
style = "italic #888888"
format = '[$path]($style)[$read_only]($read_only_style)'
repo_root_style = 'bold #888888'
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)'

[custom.pwd]
command = "basename \"$PWD\""
when = true
format = "[$output]($style)"
style = "italic #888888"

[cmd_duration]
format = "[◄ $duration ](italic #c1c1c1)"

[jobs]
format = "[$symbol$number]($style) "
style = "#c1c1c1"
symbol = "[▶](#888888 italic)"

[localip]
ssh_only = true
format = " ◯[$localipv4](bold #aaaaaa)"
disabled = false

[time]
disabled = false
format = "[ $time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "italic dimmed #c1c1c1"

[battery]
format = "[ $percentage $symbol]($style)"
full_symbol = "█"
charging_symbol = "[↑](italic bold #888888)"
discharging_symbol = "↓"
unknown_symbol = "░"
empty_symbol = "▃"

[[battery.display]]
threshold = 20
style = "italic bold #aaaaaa"

[[battery.display]]
threshold = 60
style = "italic dimmed #aaaaaa"

[[battery.display]]
threshold = 70
style = "italic dimmed #ffffff"

[git_branch]
format = " [$symbol $branch(:$remote_branch)]($style)"
symbol = "⎇"
style = "italic #888888"
truncation_symbol = "⋯"
truncation_length = 11
ignore_branches = []
only_attached = true

[git_metrics]
format = '([▴$added]($added_style))([▿$deleted]($deleted_style))'
added_style = 'italic dimmed #888888'
deleted_style = 'italic dimmed #aaaaaa'
ignore_submodules = true
disabled = false

[git_status]
style = "bold italic #888888"
format = " [$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed]($style)"
conflicted = "[◪◦](italic #aaaaaa)"
ahead = "[▴│[${count}](bold #c1c1c1)│](italic #888888)"
behind = "[▿│[${count}](bold #c1c1c1)│](italic #aaaaaa)"
diverged = "[◇ ▴┤[${ahead_count}](regular #c1c1c1)│▿┤[${behind_count}](regular #c1c1c1)│](italic #aaaaaa)"
untracked = "[◌◦](italic #ffffff)"
stashed = "[◃◈](italic #c1c1c1)"
modified = "[†](italic #ffffff)"
staged = "[▪┤[$count](bold #c1c1c1)│](italic #aaaaaa)"
renamed = "[◎◦](italic #888888)"
deleted = "[✕](italic #aaaaaa)"

[deno]
format = " [deno](italic) [∫ $version](#888888 bold)"
version_format = "${raw}"

[lua]
format = " [lua](italic) [${symbol}${version}]($style)"
version_format = "${raw}"
symbol = "⨀ "
style = "bold #ffffff"

[nodejs]
format = " [node](italic) [◫ ($version)](bold #888888)"
version_format = "${raw}"
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
detect_extensions = []

[bun]
format = " [bun](italic) [◫ ($version)](bold #888888)"
version_format = "${raw}"

[python]
format = " [py](italic) [${symbol}${version}]($style)"
symbol = "[⌉](bold #888888)⌊ "
version_format = "${raw}"
style = "bold #ffffff"

[ruby]
format = " [rb](italic) [${symbol}${version}]($style)"
symbol = "◆ "
version_format = "${raw}"
style = "bold #aaaaaa"

[rust]
format = " [rs](italic) [$symbol$version]($style)"
symbol = "⊃ "
version_format = "${raw}"
style = "bold #aaaaaa"

[package]
format = " [pkg](italic dimmed) [$symbol$version]($style)"
version_format = "${raw}"
symbol = "◨ "
style = "dimmed #ffffff italic bold"

[swift]
format = " [sw](italic) [${symbol}${version}]($style)"
symbol = "◁ "
style = "bold #aaaaaa"
version_format = "${raw}"

[aws]
disabled = true
format = " [aws](italic) [$symbol $profile $region]($style)"
style = "bold #888888"
symbol = "▲ "

[buf]
symbol = "■ "
format = " [buf](italic) [$symbol $version $buf_version]($style)"

[c]
symbol = "ℂ "
format = " [$symbol($version(-$name))]($style)"

[cpp]
symbol = "ℂ "
format = " [$symbol($version(-$name))]($style)"

[conda]
symbol = "◯ "
format = " conda [$symbol$environment]($style)"

[pixi]
symbol = "■ "
format = " pixi [$symbol$version ($environment )]($style)"

[dart]
symbol = "◁◅ "
format = " dart [$symbol($version )]($style)"

[docker_context]
symbol = "◧ "
format = " docker [$symbol$context]($style)"

[elixir]
symbol = "△ "
format = " exs [$symbol $version OTP $otp_version ]($style)"

[elm]
symbol = "◩ "
format = " elm [$symbol($version )]($style)"

[golang]
symbol = "∩ "
format = " go [$symbol($version )]($style)"

[haskell]
symbol = "❯λ "
format = " hs [$symbol($version )]($style)"

[java]
symbol = "∪ "
format = " java [${symbol}(${version} )]($style)"

[julia]
symbol = "◎ "
format = " jl [$symbol($version )]($style)"

[memory_usage]
symbol = "▪▫▪ "
format = " mem [${ram}( ${swap})]($style)"

[nim]
symbol = "▴▲▴ "
format = " nim [$symbol($version )]($style)"

[nix_shell]
style = 'bold italic dimmed #888888'
symbol = '✶'
format = '[$symbol nix⎪$state⎪]($style) [$name](italic dimmed #c1c1c1)'
impure_msg = '[⌽](bold dimmed #aaaaaa)'
pure_msg = '[⌾](bold dimmed #888888)'
unknown_msg = '[◌](bold dimmed #ffffff)'

[spack]
symbol = "◇ "
format = " spack [$symbol$environment]($style)"